# Evolution API — o alimentador de WhatsApp.
# Suba isto só quando for conectar o número. O dashboard não depende dele:
# tudo lê do SQLite em data/interea.db.
#
#   docker compose up -d
#   abra http://localhost:8080/manager  → crie a instância → leia o QR code
#
# CHIP DESCARTÁVEL. Baileys é WhatsApp Web não oficial e ban acontece.
# Nunca conecte número pessoal.
services:
  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-interea-dev}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evo:evo@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      # Toda mensagem cai no nosso webhook.
      # host.docker.internal alcança o `next dev` rodando na sua máquina.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://host.docker.internal:3000/api/webhook/evolution
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    depends_on: [postgres]
    extra_hosts: ["host.docker.internal:host-gateway"]

  # Postgres é do Evolution, não nosso. Nosso banco é o SQLite.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evo
      POSTGRES_PASSWORD: evo
      POSTGRES_DB: evolution
    volumes: [evo_pg:/var/lib/postgresql/data]

volumes:
  evo_pg:
